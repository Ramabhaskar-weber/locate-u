<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Locate U — a premium travel companion for India. World map, place search, and an explorer for all 28 states and 8 union territories." />
    <meta name="theme-color" content="#f4f6fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Locate U — Explore India</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var s = JSON.parse(localStorage.getItem('locate-u-settings') || '{}');
        var t = (s.state && s.state.theme) || 'system';
        var dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <noscript>Locate U needs JavaScript to run the interactive map.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
